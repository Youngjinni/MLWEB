name: Java CI/CD with Docker

on:
  push:
    branches: [ "main" ] # 메인 브랜치에 푸시될 때 작동

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      # 1. 빌드 (Jar 생성)
      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew :backend:authservice:clean :backend:communityservice:clean :backend:gatewayservice:clean :backend:lstmanalysis:clean :backend:rfanalysis:clean :backend:authservice:bootJar :backend:communityservice:bootJar :backend:gatewayservice:bootJar :backend:lstmanalysis:bootJar :backend:rfanalysis:bootJar -x test

      # 2. 도커 이미지 빌드 및 푸시
      - name: Docker Login & Push
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/auth-service ./backend/authservice
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/auth-service

      # 3. 오라클 인스턴스 원격 배포
      - name: Deploy to OCI
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/auth-service
            docker stop authservice || true
            docker rm authservice || true
            # 여기에 로컬에서 썼던 docker run 명령어나 docker-compose up 실행
            cd ~/project && docker compose up -d --build authservice