version: '3.8'

services:
  oracle-db:
    image: gvenzl/oracle-xe:21-slim
    container_name: oracle-db
    ports:
      - "1522:1521"
    env_file: .env
    environment:
      - ORACLE_PASSWORD=${DB_PASSWORD}
      - APP_USER=${DB_USERNAME}
      - APP_USER_PASSWORD=${DB_PASSWORD}
    volumes:
      - ./oracle-data:/opt/oracle/oradata
    # gvenzl 이미지 내장 healthcheck.sh 사용
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 90s
    networks:
      - mlweb-net

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - ./redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - mlweb-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mlwebfrontend
    ports:
      - "80:80"
    depends_on:
      - gatewayservice
    networks:
      - mlweb-net

  gatewayservice:
    build:
      context: .
      dockerfile: backend/gatewayservice/Dockerfile
    container_name: gatewayservice
    ports:
      - "8080:8080"
    environment:
      - GATEWAY_PORT=8080
      - JWT_SECRET=${JWT_SECRET}
    networks:
      - mlweb-net

  authservice:
    build:
      context: .
      dockerfile: backend/authservice/Dockerfile
    container_name: authservice
    ports:
      - "8081:8081"
    environment:
      - AUTH_SERVICE_PORT=8081
      - DB_URL=jdbc:oracle:thin:@oracle-db:1521:XE
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    depends_on:
      oracle-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mlweb-net

  communityservice:
    build:
      context: .
      dockerfile: backend/communityservice/Dockerfile
    container_name: communityservice
    ports:
      - "8082:8082"
    environment:
      - COMMUNITY_PORT=8082
      - DB_URL=jdbc:oracle:thin:@oracle-db:1521:XE
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      oracle-db:
        condition: service_healthy
    networks:
      - mlweb-net

  lstmanalysis:
    build:
      context: .
      dockerfile: backend/lstmanalysis/Dockerfile
    container_name: lstmanalysis
    ports:
      - "8083:8083"
    environment:
      - LSTM_PORT=8083
      - DB_URL=jdbc:oracle:thin:@oracle-db:1521:XE
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      oracle-db:
        condition: service_healthy
    networks:
      - mlweb-net

  rfanalysis:
    build:
      context: .
      dockerfile: backend/rfanalysis/Dockerfile
    container_name: rfanalysis
    ports:
      - "8084:8084"
    environment:
      - RF_PORT=8084
      - DB_URL=jdbc:oracle:thin:@oracle-db:1521:XE
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      oracle-db:
        condition: service_healthy
    networks:
      - mlweb-net

networks:
  mlweb-net:
    driver: bridge
